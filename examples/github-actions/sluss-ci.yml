# Example only. Install on the default branch, protect it and its dependencies,
# and use isolated runners with unique labels for each physical host.
name: Sluss CI example
on:
  workflow_dispatch:
    inputs:
      sluss_host:
        description: Unique label of the reserved physical host
        required: true
        type: string
      sluss_suites:
        description: Comma-separated verification suites selected by Sluss
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: [self-hosted, "${{ inputs.sluss_host }}"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run configured suites
        env:
          SLUSS_SUITES: ${{ inputs.sluss_suites }}
        run: |
          case "$SLUSS_SUITES" in
            full) cargo test --workspace --locked ;;
            *) echo "Unsupported suite selection" >&2; exit 1 ;;
          esac
