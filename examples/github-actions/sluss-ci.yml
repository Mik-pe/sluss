# Example only. Install on the default branch, protect it and its dependencies,
# and use isolated runners with unique labels for each physical host.
name: Sluss CI example
on:
  workflow_dispatch:
    inputs:
      sluss_host:
        description: Unique label of the reserved physical host
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: [self-hosted, "${{ inputs.sluss_host }}"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: cargo test --workspace --locked
