# Experimental observation-only configuration. Store this outside PR-controlled paths.
version = 1

[github]
app_client_id = "YOUR_APP_CLIENT_ID"
installation_id = 12345
repository_id = 67890
owner = "your-owner"
repository = "your-repository"

[queue]
target = "main"
max_batch_size = 4
adaptive_batching = false # Optional measured CI-only sizing; requires max_active_batches = 1.
max_active_batches = 1
debounce_seconds = 60
batch_window_seconds = 60
poll_seconds = 5
rescan_seconds = 300

[checks]
required_reviews = 1
block_labels = ["do-not-merge", "owner-hold"]

[merge]
mode = "disabled"
