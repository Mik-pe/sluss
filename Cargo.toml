[package]
name = "sluss"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A capacity-aware CI orchestrator and merge queue"
repository = "https://github.com/Mik-pe/sluss"

[dependencies]
axum = "0.8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
