[package]
name = "sluss"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A capacity-aware CI orchestrator and merge queue"
repository = "https://github.com/Mik-pe/sluss"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
